# First serial port (COM1 / ttyS0) for GRUB and kernel log — common for GCE and IPMI.
# Sourced by /etc/default/grub. Run update-grub after first boot if this was copied
# without running the post-install maintainer script.

GRUB_SERIAL_COMMAND='serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1'
GRUB_TERMINAL_INPUT="serial console"
GRUB_TERMINAL_OUTPUT="serial console"
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} console=ttyS0,115200"
